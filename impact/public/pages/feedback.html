<section class="wrap section dashboard feedback-page"><h1>Leave feedback</h1><form id="feedback" method="post" action="/api/feedback"><label>Name<input name="name" autocomplete="name" minlength="2" maxlength="100" required></label><label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Company <small>(optional)</small><input name="company" autocomplete="organization" maxlength="120"></label><label>Rating<select name="rating" required><option value="">Choose a rating</option><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Satisfactory</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></label><label>Feedback<textarea name="message" minlength="10" maxlength="2500" rows="3" required></textarea></label><label hidden>Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="consent"><input type="checkbox" name="consent" value="yes" required> I agree that my name, company, rating and feedback may be published after review.</label><button class="button">Submit feedback</button><p class="form-status" role="status"></p></form><p><a href="/feedback">Back to client feedback</a></p></section>
